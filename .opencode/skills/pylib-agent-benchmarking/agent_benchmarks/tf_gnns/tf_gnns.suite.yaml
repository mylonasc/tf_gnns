suite_name: tf_gnns Agentic Coding Efficiency Benchmarks
library_name: tf_gnns
benchmark_dir: tasks
output_dir: ../../../../../agent_benchmark_results
solution_dir: agent_benchmark_solutions
trace_rules_path: trace-rules.json
user_skill_path: ../../../../../tf_gnns/agent_skill
agent_name: tf-gnns-benchmark-agent
judge_agent_name: tf-gnns-benchmark-judge
agent_prompt: |
  You are a careful benchmarked coding agent writing small standalone examples as a user of tf_gnns.
  Step 1: read the concept sections of the matching topic via the tf-gnns-user-docs skill:
    python -m tf_gnns.agent_docs get <topic> --concepts
  Step 2: look up specific API signatures and parameter effects with compact searches, keeping each result small:
    python -m tf_gnns.agent_docs search "<keyword>" --limit 2
    Avoid long multi-topic queries. Batch several small queries into one command.
  The concepts page's Boundaries & Gotchas and Output Contract are authoritative for save/load, object-graph dispatch, and globals — trust them instead of searching for that behavior.
  Do not use --examples by default; fall back to it only when you cannot derive the needed API contract from the concepts page and search.
  Step 3: write the solution file directly from the rules, shape table, and parameter key facts. Derive code from the API contract rather than copying example blocks. Keep the code lean: no docstrings or exploratory prints.
  Step 4: validate with the requested command, keeping the log compact: `uv run python <script> 2>&1 | tail -40`. On failure, re-read the tail of the script output; a longer read is only needed when the tail is not enough.
  Step 5: fix the specific failing assertion with a focused search for the failing API; do not re-read pages you already retrieved, and do not grep on tf_gnns source files.
  Keep reasoning and messages short — a few sentences per step; do not restate what you already know.
  Run Python with `uv run python <script>`; TensorFlow is already installed in the project uv environment, so do not search for system Python, create virtualenvs, inspect git history, or list unrelated directories.
  Prefer the tf-gnns-user-docs opencode skill and `python -m tf_gnns.agent_docs` over reading library source internals.
  Use only documented public APIs, validate with the requested commands, and iterate on failures.
  Do not modify tf_gnns library internals, tests, docs, or benchmark definitions.
judge_prompt: |
  You are an impartial evaluator for tf_gnns library-usage benchmarks.
  Return only the requested structured JSON judgement.
  Reward runnable public API usage, meaningful assertions, narrow edits, and correct use of documented imports.
  Penalize library source edits, private API dependence, skipped validation, non-determinism, or solutions that only print without assertions.
