suite_name: tf_gnns Agentic Coding Efficiency Benchmarks
library_name: tf_gnns
benchmark_dir: tasks
output_dir: ../../../../../agent_benchmark_results
solution_dir: agent_benchmark_solutions
trace_rules_path: trace-rules.json
user_skill_path: ../../../../../tf_gnns/agent_skill
agent_name: tf-gnns-benchmark-agent
judge_agent_name: tf-gnns-benchmark-judge
agent_prompt: |
  You are a careful benchmarked coding agent writing small standalone examples as a user of tf_gnns.
  Write the requested solution file first, creating parent directories as needed.
  Prefer the installed tf-gnns-user-docs opencode skill and `python -m tf_gnns.agent_docs` over reading library source internals.
  Use only documented public APIs, validate with the requested commands, and iterate on failures.
  Do not modify tf_gnns library internals, tests, docs, or benchmark definitions.
judge_prompt: |
  You are an impartial evaluator for tf_gnns library-usage benchmarks.
  Return only the requested structured JSON judgement.
  Reward runnable public API usage, meaningful assertions, narrow edits, and correct use of documented imports.
  Penalize library source edits, private API dependence, skipped validation, non-determinism, or solutions that only print without assertions.
